# AI Mock Interview Coach: local AI services. The app itself runs on the host (npm).
# Use the Makefile (`make help`) instead of calling docker compose directly.
name: ai-interview-coach

services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.40.13}
    restart: 'no'
    ports:
      - '127.0.0.1:${OLLAMA_PORT:-11435}:11434' # this computer only; 11435 avoids other projects' 11434
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      # Interviewer and evaluator together (~6.4 GB) would crowd the 7 GB limit; swap instead (5-9 s).
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - type: bind
        source: ${MODELS_DIR:?MODELS_DIR is not set; run make setup}/ollama
        target: /models
        bind:
          create_host_path: false # fail instead of writing models to the root disk when the drive is unmounted
    mem_limit: ${OLLAMA_MEM_LIMIT:-7g}
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  piper:
    build:
      context: docker
      dockerfile: piper.Dockerfile
      args:
        UID: ${HOST_UID:-1000}
    image: ai-interview-coach-piper:1.8.0
    # Restarts by itself if the server crashes (or is killed); `make deps-down` still stops it.
    restart: on-failure:5
    init: true # forwards signals to the server, so it stops in under a second
    ports:
      - '127.0.0.1:${PIPER_PORT:-5150}:5000' # this computer only
    environment:
      PIPER_VOICE: ${PIPER_DEFAULT_VOICE:-en_US-ljspeech-medium}
    volumes:
      - type: bind
        source: ${MODELS_DIR:?MODELS_DIR is not set; run make setup}/piper
        target: /voices
        read_only: true
        bind:
          create_host_path: false
    mem_limit: ${PIPER_MEM_LIMIT:-2g}
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/info', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
