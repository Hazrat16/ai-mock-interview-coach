# AI Mock Interview Coach: local AI services. The app itself runs on the host (npm).
# Use the Makefile (`make help`) instead of calling docker compose directly.
name: ai-interview-coach

services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.40.13}
    restart: 'no'
    ports:
      - '127.0.0.1:${OLLAMA_PORT:-11435}:11434' # this computer only; 11435 avoids other projects' 11434
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
    volumes:
      - type: bind
        source: ${MODELS_DIR:?MODELS_DIR is not set; run make setup}/ollama
        target: /models
        bind:
          create_host_path: false # fail instead of writing models to the root disk when the drive is unmounted
    mem_limit: ${OLLAMA_MEM_LIMIT:-7g}
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
